<title>QA Results</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root {
  --bg: #f5f7f8; --surface: #ffffff; --soft: #eef1f3; --fg: #17212b; --muted: #5b6875; --line: #dbe1e6; --accent: #0f6e8c;
  --pass: #1d7a46; --fail: #b3261e;
  --sans: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif; --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f151b; --surface: #17202a; --soft: #1e2934; --fg: #e3e9ee; --muted: #93a1ae; --line: #2a3642; --accent: #5cb8d6;
  --pass: #6fd39a; --fail: #f2948c; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0f151b; --surface: #17202a; --soft: #1e2934; --fg: #e3e9ee; --muted: #93a1ae; --line: #2a3642; --accent: #5cb8d6;
  --pass: #6fd39a; --fail: #f2948c; color-scheme: dark }
body { background: var(--bg); color: var(--fg); font-family: var(--sans); font-size: 15px; line-height: 1.5; }
main { max-width: 1080px; margin: 0 auto; padding-block: 28px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1 { margin: 0; font-size: 1.5rem; font-weight: 600; text-wrap: balance; }
h1.failed { color: var(--fail); }
.meta { margin: 2px 0 0; color: var(--muted); font-family: var(--mono); font-size: 0.82rem; font-variant-numeric: tabular-nums; }
.layout { display: grid; grid-template-columns: 260px minmax(0, 1fr); gap: 24px; margin-top: 22px; align-items: start; }
@media (max-width: 720px) { .layout { grid-template-columns: minmax(0, 1fr); } }
nav { display: grid; gap: 2px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); }
@media (max-width: 720px) { nav { position: static; } }
.group { display: flex; justify-content: space-between; gap: 8px; margin: 14px 0 4px; font-weight: 600; font-size: 0.9rem; }
.group:first-child { margin-top: 0; }
.group span { font-weight: 400; color: var(--muted); font-size: 0.8rem; }
.group span.failed, .setup { color: var(--fail); }
.setup { font-size: 0.8rem; margin: 0 0 4px; overflow-wrap: anywhere; }
nav button { display: flex; gap: 8px; align-items: baseline; text-align: left; padding: 6px 10px; border: 0; border-radius: 6px; background: none; color: inherit; font: inherit; font-size: 0.9rem; cursor: pointer; }
nav button:hover { background: var(--soft); }
nav button[aria-current="true"] { background: var(--surface); box-shadow: 0 0 0 1px var(--line); font-weight: 600; }
nav button:focus-visible, .step:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.mark { font-weight: 700; width: 1ch; flex: none; }
.passed { color: var(--pass); } .failed { color: var(--fail); } .skipped { color: var(--muted); }
.title { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.title h2 { margin: 0; font-size: 1.15rem; font-weight: 600; }
.sub { color: var(--muted); font-size: 0.85rem; }
.why { color: var(--fail); margin: 6px 0 0; }
.empty { margin-top: 14px; padding: 32px; border-radius: 8px; background: var(--soft); color: var(--muted); text-align: center; }
video { width: 100%; aspect-ratio: 16 / 10; background: #000; border-radius: 8px 8px 0 0; display: block; margin-top: 14px; }
.track { position: relative; height: 6px; background: var(--line); border-radius: 0 0 4px 4px; }
.track .head { position: absolute; inset: 0 auto 0 0; background: var(--muted); }
.track button { position: absolute; top: -4px; width: 4px; height: 14px; padding: 0; border: 0; border-radius: 2px; background: var(--fg); cursor: pointer; transform: translateX(-50%); }
.track button.failed { background: var(--fail); width: 5px; }
.steps { display: grid; gap: 6px; margin-top: 14px; }
.step { display: grid; grid-template-columns: 1ch minmax(0, 1fr) auto; gap: 10px; padding: 9px 12px; border: 0; border-radius: 8px; background: var(--surface); box-shadow: 0 0 0 1px var(--line); color: inherit; font: inherit; text-align: left; cursor: pointer; }
.step[disabled] { cursor: default; }
.step.now { box-shadow: 0 0 0 2px var(--accent); }
.step b { font-weight: 600; }
.step .time { font-family: var(--mono); font-size: 0.8rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.evidence { display: block; margin-top: 3px; color: var(--muted); font-size: 0.82rem; overflow-wrap: anywhere; }
.err { display: block; margin-top: 3px; font-family: var(--mono); font-size: 0.8rem; color: var(--fail); white-space: pre-wrap; overflow-wrap: anywhere; }
.links { margin: 12px 0 0; font-size: 0.9rem; }
a { color: var(--accent); }
.shots { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; margin-top: 18px; }
figure { margin: 0; display: grid; gap: 4px; min-width: 0; }
figure img { border: 1px solid var(--line); border-radius: 6px; display: block; }
figcaption { font-size: 0.82rem; color: var(--muted); }
</style>

<main>
  <h1 id="heading">No run yet</h1>
  <p class="meta" id="meta">A QA run publishes its cases, videos and screenshots here.</p>
  <div class="layout" id="layout" hidden>
    <nav id="nav" aria-label="Test cases"></nav>
    <section id="case" aria-live="polite"></section>
  </div>
</main>

<script>
const MARKS = { passed: "✓", failed: "✗", skipped: "–" };
const cases = [];
let current = null;

function el(tag, attrs, ...children) {
  const node = document.createElement(tag);
  Object.assign(node, attrs);
  node.append(...children.filter((c) => c != null));
  return node;
}

function clock(sec) {
  sec = Math.floor(sec || 0);
  return `${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, "0")}`;
}

function mark(status) {
  return el("span", { className: `mark ${status}` }, MARKS[status] || MARKS.skipped);
}

function load(path) {
  return fetch(path, { cache: "no-store" }).then((r) => (r.ok ? r.json() : null)).catch(() => null);
}

function seek(sec) {
  const video = document.querySelector("video");
  if (!video) return;
  const go = () => { video.currentTime = sec; video.play().catch(() => {}); };
  if (video.readyState >= 1) go(); else video.addEventListener("loadedmetadata", go, { once: true });
}

function show(item, stepNumber) {
  current = item;
  document.querySelectorAll("nav button").forEach((b) => b.setAttribute("aria-current", String(b.dataset.key === item.key)));
  const { run, base } = item;
  const steps = run ? run.steps || [] : [];
  const pane = document.getElementById("case");
  const sub = [item.suite, run && run.durationSec ? clock(run.durationSec) : null].filter(Boolean).join(" · ");
  pane.replaceChildren(el("div", { className: "title" }, mark(item.status), el("h2", {}, item.title), el("span", { className: "sub" }, sub)));
  const failedAt = steps.findIndex((s) => s.status === "failed") + 1;
  if (run && run.failure) {
    const where = failedAt ? `S${failedAt} failed at ${clock(run.failure.atSec)}. ` : "";
    pane.append(el("p", { className: "why" }, `${where}${run.failure.what || ""} ${run.failure.why || ""}`.trim()));
  }
  if (!run) {
    pane.append(el("div", { className: "empty" }, `${item.reason}. No recording.`));
    return;
  }
  const duration = run.durationSec || 1;
  if (run.video) {
    const video = el("video", { src: `${base}/video.webm`, controls: true, muted: true, playsInline: true, preload: "metadata" });
    const head = el("div", { className: "head" });
    const track = el("div", { className: "track" }, head);
    steps.forEach((s, i) => {
      if (s.offsetSec == null) return;
      const tick = el("button", { type: "button", className: s.status === "failed" ? "failed" : "", title: `S${i + 1} ${s.title}`, ariaLabel: `Play S${i + 1} from ${clock(s.offsetSec)}` });
      tick.style.left = `${(s.offsetSec / duration) * 100}%`;
      tick.addEventListener("click", () => seek(s.offsetSec));
      track.append(tick);
    });
    video.addEventListener("timeupdate", () => {
      head.style.width = `${Math.min(100, (video.currentTime / duration) * 100)}%`;
      let now = -1;
      steps.forEach((s, i) => { if (s.offsetSec != null && s.offsetSec <= video.currentTime + 0.25) now = i; });
      document.querySelectorAll(".step").forEach((b, i) => b.classList.toggle("now", i === now));
    });
    pane.append(video, track);
  }
  const list = el("div", { className: "steps" });
  steps.forEach((s, i) => {
    const playable = run.video && s.offsetSec != null;
    const detail = el("span", {},
      s.status === "skipped" ? el("span", { className: "skipped" }, `S${i + 1} ${s.title} · Not run.`) : el("b", {}, `S${i + 1} ${s.title}`),
      s.status === "skipped" ? null : ` ${s.summary || ""}`,
      s.evidence ? el("span", { className: "evidence" }, s.evidence) : null,
      s.error ? el("span", { className: "err" }, s.error) : null);
    const row = el("button", { type: "button", className: "step", disabled: !playable }, mark(s.status), detail, el("span", { className: "time" }, s.offsetSec != null ? clock(s.offsetSec) : ""));
    if (playable) row.addEventListener("click", () => seek(s.offsetSec));
    list.append(row);
  });
  pane.append(list);
  if (run.matterUrl) pane.append(el("p", { className: "links" }, el("a", { href: run.matterUrl, target: "_blank", rel: "noopener" }, "Open the matter it made ↗")));
  if (run.screenshots && run.screenshots.length) {
    pane.append(el("div", { className: "shots" }, ...run.screenshots.map((s) =>
      el("figure", {}, el("img", { src: `${base}/${s.file}`, alt: s.name, loading: "lazy" }), el("figcaption", {}, s.name)))));
  }
  const start = stepNumber || failedAt;
  if (start && steps[start - 1] && steps[start - 1].offsetSec != null) seek(steps[start - 1].offsetSec);
}

load("summary.json").then(async (summary) => {
  if (!summary) return;
  const heading = document.getElementById("heading");
  const nav = document.getElementById("nav");
  if (summary.result === "BLOCKED") {
    heading.textContent = "Blocked";
    heading.className = "failed";
    document.getElementById("meta").textContent = summary.blockedReason || "Nothing could run.";
    return;
  }
  let total = 0;
  for (const suite of summary.suites || []) {
    const setupFailed = suite.setup && suite.setup.status === "failed";
    const passed = suite.cases.filter((c) => c.status === "passed").length;
    nav.append(el("div", { className: "group" }, suite.name,
      el("span", { className: setupFailed ? "failed" : "" }, setupFailed ? "setup failed" : `${passed} of ${suite.cases.length} passed`)));
    if (setupFailed) nav.append(el("p", { className: "setup" }, suite.setup.error || ""));
    for (const c of suite.cases) {
      const base = `${suite.name}/${c.name}`;
      const run = c.status === "skipped" ? null : await load(`${base}/run.json`);
      const reason = setupFailed ? "Not run: setup failed" : c.reason || "Not run";
      const item = { key: `${suite.name}.${c.name}`, suite: suite.name, title: c.title || c.name, status: c.status, run, base, reason };
      total += (run && run.durationSec) || 0;
      cases.push(item);
      const button = el("button", { type: "button" }, mark(c.status), c.title || c.name);
      button.dataset.key = item.key;
      button.addEventListener("click", () => {
        show(item);
        if (matchMedia("(max-width: 720px)").matches) document.getElementById("case").scrollIntoView({ behavior: "smooth" });
      });
      nav.append(button);
    }
  }
  const passed = cases.filter((c) => c.status === "passed").length;
  heading.textContent = `${passed} of ${cases.length} cases passed`;
  heading.className = summary.result === "PASS" ? "" : "failed";
  const when = summary.startedAt ? new Date(summary.startedAt).toLocaleString(undefined, { dateStyle: "medium", timeStyle: "short" }) : "";
  const host = summary.baseUrl ? new URL(summary.baseUrl).host : "";
  document.getElementById("meta").textContent = [when, host, total ? clock(total) : ""].filter(Boolean).join(" · ");
  document.getElementById("layout").hidden = false;
  openLinked();
  addEventListener("hashchange", openLinked);
});

function openLinked() {
  const match = /^#(.+?)(?:\.s(\d+))?$/.exec(location.hash);
  const linked = match && cases.find((c) => c.key === match[1]);
  const first = linked || cases.find((c) => c.status === "failed") || cases[0];
  if (first) show(first, linked && match[2] ? Number(match[2]) : 0);
}
</script>
